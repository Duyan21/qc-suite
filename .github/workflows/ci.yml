name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: ankane/pgvector
        env:
          POSTGRES_USER: qcsuite
          POSTGRES_PASSWORD: qcsuite123
          POSTGRES_DB: qcsuite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qcsuite -d qcsuite_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://qcsuite:qcsuite123@localhost:5432/qcsuite_db
      SECRET_KEY: ci-test-secret-key
      SUPERADMIN_EMAIL: ci@example.com
      # GEMINI_API_KEY intentionally unset — tests that need a real key
      # self-skip (see backend/tests/*: requires_real_gemini_key marker).
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=qcsuite123 psql -h localhost -U qcsuite -d qcsuite_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
